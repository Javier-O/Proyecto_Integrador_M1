<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Paletas de Color</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado de la página -->
  <header>
    <h1>Generador de Paletas de Color</h1>
    <p>Genera paletas aleatorias en formato HEX y HSL</p>
  </header>

  <!-- Sección de controles: aquí el usuario elige tamaño y formato -->
  <section class="controles">

    <div class="control">
      <label for="tamano">Tamaño de la paleta:</label>
      <select id="tamano">
        <option value="6">6 colores</option>
        <option value="8">8 colores</option>
        <option value="9">9 colores</option>
      </select>
    </div>

    <div class="control">
      <label for="formato">Formato del código:</label>
      <select id="formato">
        <option value="hex">HEX</option>
        <option value="hsl">HSL</option>
      </select>
    </div>

    <!-- Botón central que dispara la generación de la paleta -->
    <button id="btnGenerar">Generar Paleta</button>

    <!-- Botón para guardar la paleta actual en localStorage -->
    <button id="btnGuardar">Guardar Paleta</button>

  </section>

  <!-- Aquí se van a insertar los colores generados con JavaScript -->
  <main>
    <section id="paleta" class="paleta"></section>

    <!-- Sección donde se listan las paletas guardadas en localStorage -->
    <section class="guardadas">
      <h2>Paletas Guardadas</h2>
      <div id="listaGuardadas" class="lista-guardadas">
        <!-- Aquí JS va a insertar las miniaturas de las paletas guardadas -->
      </div>
    </section>
  </main>

  <footer>
    <p>Proyecto Integrador - Módulo 1</p>
  </footer>
<!-- Toast: notificación flotante de microfeedback, reutilizada en toda la página -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- El script va al final para asegurar que el HTML ya cargó -->
  <script src="script.js"></script>
</body>
</html>
